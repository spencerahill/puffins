name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # needed for setuptools-scm
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.81.0
          environments: default
      - run: pixi run ruff check --fix .
      - run: pixi run ruff format .
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "style: auto-format with ruff"
      - run: pixi run mypy puffins/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # pixi environments, one per Python version (pyproject.toml)
        environment: [py311, py312, py313, py314]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # needed for setuptools-scm
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.81.0
          environments: ${{ matrix.environment }}
      - run: pixi run -e ${{ matrix.environment }} pytest -W error::RuntimeWarning --cov=puffins --cov-report=xml || test $? -eq 5

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # needed for setuptools-scm
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.81.0
          environments: docs
      # -W turns warnings (broken cross-references, missing toctree entries)
      # into build failures.
      - run: pixi run -e docs sphinx-build -W -b html docs docs/_build/html
