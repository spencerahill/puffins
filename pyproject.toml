[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "puffins"
dynamic = ["version"]
description = "Functions for computing things in climate science"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Spencer A. Hill", email = "shill1@ccny.cuny.edu" }]
keywords = ["climate", "science"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
  "eofs",
  "faceted",
  # 3.11 is the first release to register the bold and italic faces of
  # macOS's Helvetica collection, which plotting.plt_rc_params_custom uses.
  "matplotlib>=3.11",
  "numpy",
  "pymannkendall",
  "scipy",
  "scikit-learn",
  "statsmodels",
  "xarray",
]

[project.optional-dependencies]
# windspharm/pyspharm require a Fortran compiler and legacy numpy.distutils,
# so pip cannot build them; conda-forge has prebuilt ones (see tool.pixi below).
fortran = ["windspharm"]
dev = [
  # For the tests on cftime calendars, such as noleap.
  "cftime",
  "mypy",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "ruff",
]
docs = [
  "sphinx>=7",
  "pydata-sphinx-theme>=0.15",
]

[project.urls]
Homepage = "https://github.com/spencerahill/puffins"

[tool.setuptools.packages.find]
include = ["puffins*"]

[tool.setuptools_scm]

# --- Tool Configuration ---

# Development and CI environments, managed by pixi and locked in pixi.lock.
# Packages come from conda-forge, which has pyspharm prebuilt against numpy 2;
# faceted (not on conda-forge) and puffins itself, editable, come from PyPI.
#
#   pixi run pytest                     # default environment, budget_adj included
#   pixi run -e py311 pytest            # one of CI's four Python versions
#   pixi run -e docs sphinx-build -W -b html docs docs/_build/html
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]
requires-pixi = ">=0.81.0"

# conda-forge builds of [project.dependencies], which pixi installs in place of
# the PyPI packages of the same name.
[tool.pixi.dependencies]
eofs = "*"
matplotlib-base = ">=3.11"
# Capped below 2.5, as in uv.lock (2.4.3), for mypy: with numpy 2.5.4, mypy
# 1.19.1 and 1.20.2 stop on a `type` statement in numpy's stubs under
# python_version 3.11, and mypy 2.4.0 reports 29 errors (2026-10-25).
numpy = "<2.5"
pymannkendall = "*"
scikit-learn = "*"
scipy = "*"
statsmodels = "*"
xarray = "*"

[tool.pixi.pypi-dependencies]
puffins = { path = ".", editable = true }

[tool.pixi.feature.fortran.dependencies]
windspharm = "*"

[tool.pixi.feature.dev.dependencies]
cftime = "*"
# Pinned to 1.19, as in uv.lock (see numpy above).
mypy = "1.19.*"
pre-commit = "*"
pytest = "*"
pytest-cov = "*"
ruff = "*"

[tool.pixi.feature.docs.dependencies]
sphinx = ">=7"
pydata-sphinx-theme = ">=0.15"

# For publish.yml: builds the sdist and wheel, without puffins installed.
[tool.pixi.feature.build.dependencies]
python-build = "*"
twine = "*"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

# Each environment pins its Python: left unpinned, the solver picked 3.11 for
# one and 3.15, newer than puffins supports, for others. default and py314
# share a solve group, so they lock to the same packages.
[tool.pixi.environments]
default = { features = ["dev", "fortran", "py314"], solve-group = "py314" }
py311 = ["dev", "fortran", "py311"]
py312 = ["dev", "fortran", "py312"]
py313 = ["dev", "fortran", "py313"]
py314 = { features = ["dev", "fortran", "py314"], solve-group = "py314" }
docs = ["docs", "py314"]
build = { features = ["build", "py314"], no-default-feature = true }

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "NPY", # numpy-specific rules
]
ignore = [
  # TODO: tighten these incrementally
  "F401",   # unused imports (many are intentional re-exports)
  "F811",   # redefined unused name
  "F821",   # undefined name (cross-module references)
  "F841",   # local variable assigned but never used
  "E501",   # line too long (formatter handles most; a few remain)
  "E741",   # ambiguous variable name (common in math/physics code)
  "B904",   # raise ... from err (requires code audit)
  "B905",   # zip() without strict= (requires code audit)
  "SIM108", # use ternary operator (readability preference)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports are intentional

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["puffins/tests"]
addopts = "-v --tb=short"


[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# Global so that suppressions in test files (which are outside the strict
# overrides below) cannot silently outlive the errors they suppress.
warn_unused_ignores = true

# Strict checking for fully type-annotated modules.
# Add modules here as they complete type annotation.
[[tool.mypy.overrides]]
module = [
    "puffins._typing",
    "puffins.bootstrap",
    "puffins.budget_adj",
    "puffins.calculus",
    "puffins.constants",
    "puffins.dates",
    "puffins.dynamics",
    "puffins.enso",
    "puffins.eofs",
    "puffins.eq_area",
    "puffins.grad_bal",
    "puffins.had_cell",
    "puffins.held_hou_1980",
    "puffins.hides",
    "puffins.interp",
    "puffins.lcl",
    "puffins.longitude",
    "puffins.names",
    "puffins.num_solver",
    "puffins.polar_amp",
    "puffins.radiation",
    "puffins.stats",
    "puffins.therm_inert",
    "puffins.thermodynamics",
    "puffins.tropopause",
    "puffins.vert_coords",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
